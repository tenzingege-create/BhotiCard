<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BodhiCards - Dual Input Version</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="glass-panel admin-section">
        <h3>Developer Tools</h3>
        
        <div class="input-toggle-group" style="margin-bottom: 10px;">
            <button onclick="setInputMode('wylie')" id="mode-wylie" style="background: #6c5ce7; font-size: 0.7rem;">Wylie Mode</button>
            <button onclick="setInputMode('native')" id="mode-native" style="background: rgba(255,255,255,0.1); font-size: 0.7rem;">Native Mode</button>
        </div>

        <input type="text" id="wylie-input" placeholder="Type here..." onkeyup="handleInput()">
        <input type="text" id="new-tib" placeholder="Tibetan Script Preview" readonly>
        <input type="text" id="new-eng" placeholder="English Meaning">
        
        <select id="new-cat">
            <option value="Basic">💬 Basic Phrases</option>
            <option value="General">📁 General</option>
            <option value="Food">🍎 Food</option>
            <option value="Animals">🦁 Animals</option>
        </select>
        
        <input type="text" id="new-img" placeholder="Paste Image URL">

        <div class="record-box">
            <p id="record-status">Voice: Not Sampled</p>
            <button id="record-btn" onclick="startRecording()" class="btn-record">⏺ Record</button>
            <button id="stop-btn" onclick="stopRecording()" class="btn-stop" style="display:none;">⏹ Stop</button>
        </div>

        <button onclick="addNewWord()" class="btn-save-all">💾 Save Entry</button>

        <hr style="border: 0.5px solid rgba(255,255,255,0.1); margin: 20px 0;">
        <div class="transfer-box" style="display: flex; justify-content: space-around;">
            <button onclick="exportData()" style="background: #6c5ce7; color: white; width: 45%;">📥 Backup</button>
            <label for="import-file" style="background: #a29bfe; color: white; padding: 12px; border-radius: 10px; cursor: pointer; width: 40%; font-weight: bold; font-size: 12px; text-align: center;">📤 Load</label>
            <input type="file" id="import-file" style="display:none" onchange="importData(event)">
        </div>
    </div>

    <div class="filter-section">
        <button onclick="filterCategory('All')">🌟 All</button>
        <button onclick="filterCategory('Basic')">💬 Basic</button>
        <button onclick="filterCategory('Food')">🍎 Food</button>
        <button onclick="filterCategory('Animals')">🦁 Animals</button>
    </div>

    <div class="glass-panel flashcard">
        <div id="image-frame">
            <img id="display-img" src="" style="width:120px; height:120px; border-radius:15px; display:none; object-fit: cover; margin-bottom: 10px;">
        </div>
        <h1 id="tibetan-word">...</h1>
        <p id="english-word">...</p>
        <span id="display-cat" class="tag"></span>
        
        <div class="button-group" style="display: flex; justify-content: center; gap: 10px;">
            <button onclick="playVoice()" class="btn-play">🔊 Play</button>
            <button onclick="nextWord()" class="btn-next">Next ➡️</button>
        </div>
        <button onclick="deleteCurrentWord()" class="btn-delete">🗑 Delete Entry</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
